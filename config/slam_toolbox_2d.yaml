# ---------------------------------------------------------------------------
# slam_toolbox - SLAM 2D basado en grafo de poses (Karto + Ceres)
#
# Los parametros que de verdad importan para entender la clase estan
# marcados con [CLASE]. El resto son los valores por defecto.
# ---------------------------------------------------------------------------
slam_toolbox:
  ros__parameters:

    # --- solver del grafo ---------------------------------------------------
    # [CLASE] Aqui es donde vive la "optimizacion del grafo de poses":
    # Ceres minimiza el error de todas las restricciones a la vez cada vez
    # que se cierra un bucle.
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # --- frames -------------------------------------------------------------
    # [CLASE] slam_toolbox NO publica odom->base_link (eso es del robot).
    # Publica map->odom, que es la CORRECCION de la deriva de la odometria.
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    use_map_saver: true
    mode: mapping                     # mapping | localization

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02    # 50 Hz de map->odom
    map_update_interval: 1.0          # cada cuanto se re-dibuja el mapa
    resolution: 0.05                  # [CLASE] 5 cm por celda
    max_laser_range: 10.0             # [CLASE] igual al <max> del sensor URDF
    minimum_time_interval: 0.2
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    # --- scan matching ------------------------------------------------------
    use_scan_matching: true
    use_scan_barycenter: true
    # [CLASE] Solo se anade un nodo al grafo tras avanzar 30 cm o girar 0.3 rad.
    # Subirlo = grafo mas ligero y mapa mas pobre. Bajarlo = lo contrario.
    minimum_travel_distance: 0.3
    minimum_travel_heading: 0.3
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5

    # --- cierre de bucle ----------------------------------------------------
    # [CLASE] Esto es lo que quereis ver saltar cuando el robot completa
    # la vuelta al bloque central. Con do_loop_closing:false el mapa queda
    # abierto y se ve la deriva acumulada: HACEDLO, es la mejor demo.
    do_loop_closing: true
    loop_search_maximum_distance: 3.0
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # --- correlacion --------------------------------------------------------
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # --- penalizaciones del scan matcher ------------------------------------
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
